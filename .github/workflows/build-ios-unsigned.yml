name: Build Fluxer iOS (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter version
        run: flutter --version

      - name: Restore pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Strip Firebase dependencies
        run: dart tool/strip_firebase_deps.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Strip SPM from Xcode project
        run: |
          python3 << 'PYEOF'
          import re, os

          pbxproj = 'ios/Runner.xcodeproj/project.pbxproj'
          with open(pbxproj, 'r') as f:
              content = f.read()

          content = re.sub(
              r'/\* Begin XCLocalSwiftPackageReference section \*/.*?/\* End XCLocalSwiftPackageReference section \*/',
              '/* removed */', content, flags=re.DOTALL
          )
          content = re.sub(
              r'/\* Begin XCSwiftPackageProductDependency section \*/.*?/\* End XCSwiftPackageProductDependency section \*/',
              '/* removed */', content, flags=re.DOTALL
          )
          content = re.sub(r'\t\t\tpackageReferences = \([^)]*\);\n', '', content, flags=re.DOTALL)

          with open(pbxproj, 'w') as f:
              f.write(content)

          for root, dirs, files in os.walk('ios'):
              for f in files:
                  if f == 'Package.resolved':
                      os.remove(os.path.join(root, f))
          print('SPM stripped')
          PYEOF

      - name: Build with xcodebuild
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme canary \
            -configuration Release-canary \
            -sdk iphoneos \
            -derivedDataPath ../build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            ENABLE_BITCODE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.6 \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Build/Products/Release-canary-iphoneos/Runner.app Payload/
          zip -r -X Fluxer.ipa Payload/
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fluxer-iOS-unsigned
          path: Fluxer.ipa
          retention-days: 5
